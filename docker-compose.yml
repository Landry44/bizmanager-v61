services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bizmanager
      POSTGRES_PASSWORD: bizmanager
      POSTGRES_DB: bizmanager
    ports:
      - "5432:5432"
    volumes:
      - bizmanager_pgdata:/var/lib/postgresql/data
volumes:
  bizmanager_pgdata:
